name: CI

on:
  push:
    branches: [ main, research/mobilepixornext-under1m ]
  pull_request:
    branches: [ main, research/mobilepixornext-under1m ]
  workflow_dispatch:

jobs:
  lint-and-syntax:
    name: Syntax & Bytecode Compilation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Compile python files
        run: |
          python -m compileall -q detector/ tools/ tests/

  smoke-tests:
    name: Model & Pipeline Smoke Tests
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install PyTorch CPU & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt pytest

      - name: Run Smoke Tests
        run: |
          pytest tests/ -v
