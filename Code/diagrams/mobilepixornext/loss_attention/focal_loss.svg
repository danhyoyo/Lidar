    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Serif'; text-anchor: middle; fill: #242629" x="648" y="31.990625" transform="rotate(-0 648 31.990625)">Gaussian Heatmap · Modified Focal Loss</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; text-anchor: middle; fill: #59616a" x="648" y="63.362344" transform="rotate(-0 648 63.362344)">Classification term in OGA · cls_encoding=gaussian · separate from the backbone Focal Context block</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Serif'; text-anchor: start; fill: #242629" x="36.72" y="116.352422" transform="rotate(-0 36.72 116.352422)">CornerNet / CenterNet-style peak supervision</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(164.363438 177.94725)">Heatmap logits z</text>
    <text style="font-size: 12px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(169.185 191.55525)">B × K × H × W</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(541.303437 178.160109)">p = clamp(sigmoid(z), 1e−4, 1−1e−4)</text>
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(540.491328 190.634109)">probability and log operations in FP32</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(1025.811562 177.861937)">Gaussian target Y</text>
    <text style="font-size: 12px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(1033.185 191.469937)">B × K × H × W</text>
   </g>
   <g id="text_7">
    <text style="font-size: 13px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(283.146172 328.856187)">Peak centers · Y=1</text>
    <text style="font-size: 13px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(264.998984 343.413344)">Lpos = −(1−p)^2 log(p)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(869.258437 329.061937)">Background + Gaussian neighbors · Y&lt;1</text>
    <text style="font-size: 12px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(894.915937 342.669937)">Lneg = −(1−Y)^4 p^2 log(1−p)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 13px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(485.773203 479.963766)">Lcls = [sum(Lpos) + sum(Lneg)] / max(Npeak, 1)</text>
    <text style="font-size: 13px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(494.45375 494.705766)">No peaks: retain the summed background loss</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; text-anchor: middle; fill: #242629" x="648" y="620.671562" transform="rotate(-0 648 620.671562)">Q-OGA replaces only the peak term with |q^βq−p|^2 BCE(p, q^βq); the negative term remains the same.</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Serif'; text-anchor: middle; fill: #59616a" x="648" y="652.848281" transform="rotate(-0 648 652.848281)">At q=1, the implemented quality-coupled focal loss equals this modified focal loss.</text>
   </g>
