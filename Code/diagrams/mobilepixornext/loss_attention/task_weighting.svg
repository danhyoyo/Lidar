   <g id="text_1">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Serif'; text-anchor: middle; fill: #242629" x="648" y="31.834219" transform="rotate(-0 648 31.834219)">T-SBUW · Adaptive Task Weighting with EMA Calibration</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; text-anchor: middle; fill: #59616a" x="648" y="63.437109" transform="rotate(-0 648 63.437109)">Used by both OGA and Q-OGA · learned loss weights are training-only parameters</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Serif'; text-anchor: start; fill: #242629" x="36.72" y="129.312422" transform="rotate(-0 36.72 129.312422)">One separate weighting module per group</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(146.058906 195.596516)">Raw scalar task losses Li</text>
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(136.344531 207.914109)">M=5, or M=6 with OGA IQA</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(513.372813 189.359516)">Detached running loss means mi</text>
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(521.510234 201.833516)">First train call: max(Li, 1e−4)</text>
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(525.313828 214.151109)">Then EMA momentum=0.99</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(1029.169688 195.22725)">Learned logits si</text>
    <text style="font-size: 12px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(1004.840625 208.83525)">M parameters · initial=0</text>
   </g>
   <g id="text_7">
    <text style="font-size: 12px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(1032.544688 316.272562)">Bounded scales</text>
    <text style="font-size: 12px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(1023.545625 329.709937)">sbi = 3 tanh(si / 3)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(1014.809062 428.592562)">Temperature softmax</text>
    <text style="font-size: 12px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(1008.906563 442.029937)">wi = M softmax(sbi / 2)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 12px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(346.674375 385.30725)">Calibrated tasks: Lci = Li / max(mi, 1e−4)</text>
    <text style="font-size: 12px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(375.530625 398.744625)">EMA buffers receive no gradient</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(738.267656 540.447828)">Lgroup = mean(mi) × sum_i(wi × Lci)</text>
    <text style="font-size: 13px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(745.343516 555.366547)">nominal scale mean(mi) is detached</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; text-anchor: middle; fill: #242629" x="648" y="642.242344" transform="rotate(-0 648 642.242344)">All wi &gt; 0 · sum_i wi = M · eval mode freezes EMA updates · each group owns its logits and buffers</text>
   </g>
   <g id="text_12">
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; text-anchor: middle; fill: #242629" x="648" y="717.995312" transform="rotate(-0 648 717.995312)">Defaults: temperature=2 · bound=3 · EMA momentum=0.99 · loss calibration floor=1e−4</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; text-anchor: middle; fill: #59616a" x="648" y="754.637109" transform="rotate(-0 648 754.637109)">Task weights act on loss terms; they are distinct from fixed outer group weights (0.5 / 0.5 here).</text>
   </g>
  </g>
 </g>
