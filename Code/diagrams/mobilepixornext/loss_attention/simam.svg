   <g id="text_1">
    <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Serif'; text-anchor: middle; fill: #242629" x="734.4" y="31.834219" transform="rotate(-0 734.4 31.834219)">SimAM · Spatial Energy Attention + Residual Adapter</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; text-anchor: middle; fill: #59616a" x="734.4" y="63.437109" transform="rotate(-0 734.4 63.437109)">Stage 2 / C3 · 48 × 200 × 176 · per-batch, per-channel spatial statistics</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Serif'; text-anchor: start; fill: #242629" x="36.72" y="133.739062" transform="rotate(-0 36.72 133.739062)">SimAMCore · zero learned parameters</text>
   </g>
   <g id="text_4">
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(143.508359 199.916516)">Input X</text>
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(119.955469 212.234109)">48 × 200 × 176</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(411.166719 199.916516)">Spatial mean m = meanHW(X)</text>
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(437.477344 212.234109)">FP32 · B × C × 1 × 1</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(808.354687 199.632562)">Squared deviation</text>
    <text style="font-size: 12px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(818.987812 213.069937)">d = (X − m)^2</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(800.143281 325.196516)">Channel-local variance</text>
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(776.156406 337.514109)">v = sumHW(d) / max(HW−1, 1)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(1207.244687 318.881312)">Energy score</text>
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(1180.298125 331.355312)">e = d / [4(v + λ)] + 0.5</text>
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(1216.820703 343.672906)">λ=0.0001</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(1179.477969 450.618281)">Spatial gate = sigmoid(e)</text>
    <text style="font-size: 10px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(1176.007656 461.958281)">FP32 → cast to input dtype</text>
   </g>
   <g id="text_10">
    <text style="font-size: 13px; font-family: 'DejaVu Serif'; text-anchor: middle" x="928.8" y="457.187187" transform="rotate(-0 928.8 457.187187)">×</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(608.143516 450.398312)">T(X) = X ⊙ sigmoid(e)</text>
    <text style="font-size: 11px; font-family: 'DejaVu Serif'; fill: #242629" transform="translate(625.395469 462.872312)">48 × 200 × 176</text>
